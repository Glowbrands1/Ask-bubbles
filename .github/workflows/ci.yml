name: CI

# Runs on every pull request and every push to main, so a change that breaks
# lint, the typecheck or a test shows a red ✗ on the pull request before it is
# merged — not after a manager finds it in production.
#
# merge_group: GitHub's merge queue (Pau, 7 Nov 2026). The queue tests each pull
# request on top of main and the pull requests ahead of it, on a temporary
# gh-readonly-queue/main/… branch, and merges only when the required checks
# ("checks" and "eval", below) pass there. They are the same jobs with the same
# names; neither reads pull-request-only context, so they run unchanged.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request replaces its older run; runs on main
# always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Tests
        run: npm test

  # OFF PINS (QA, 11 Nov 2026): every test named for a flag's "off" behaviour, run
  # with production's flags set (src/config/production-flags.json). A new one that
  # does not set its own flag off fails here, not the day QA turns the flag on.
  # Known failures when the guard went in: src/config/off-pins-known.json (may only
  # shrink). See scripts/off-pins-guard.mjs. Its own job, beside "checks".
  off-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Off pins hold under production's flags
        run: npm run test:off-pins

  # The replay eval (evals/): every replay case through the real chat route,
  # flags off (must equal evals/baseline.json) and with the step's flags on
  # (may break no case, at most 25% slower). Local and deterministic: an
  # in-memory database and neutral model stand-ins, no secrets, no network.
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Replay eval
        run: npm run eval
